<section class="py-10">
    <div class="container 2xl:max-w-8xl ">
        <div class="flex items-center gap-3 my-8">
            <div class="h-8 w-1.5 bg-linear-to-b from-emerald-500 to-emerald-700 rounded-full"></div>
            <h2 class="text-3xl font-bold text-gray-800">Featured <span class="text-emerald-600">Products</span></h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 mt-4 gap-4">
            @for (product of productsList() | paginate : pagination(); track product._id) {

            <app-card [product]="product"></app-card>
            }

        </div>

        <pagination-controls class="my-pagination" id="foo" (pageChange)="pageChanged($event)"
            (pageBoundsCorrection)="pageChanged($event)" [maxSize]="9" [directionLinks]="true" [autoHide]="true"
            [responsive]="true" previousLabel="Previous" nextLabel="Next" screenReaderPaginationLabel="Pagination"
            screenReaderPageLabel="page" screenReaderCurrentLabel="You're on page">
        </pagination-controls>
    </div>
</section>
