<section class="bg-slate-50/60 py-10 md:py-14">
    <div class="container mx-auto max-w-7xl px-4">

        <!-- Page header -->
        <div class="mb-10 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
            <div class="flex items-center gap-3">
                <div class="h-10 w-1.5 rounded-full bg-linear-to-b from-emerald-500 to-emerald-700"></div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-slate-900 md:text-4xl">
                        All <span class="text-emerald-600">Categories</span>
                    </h1>
                    <p class="mt-1 text-sm text-slate-500">Browse our collections and find what you need.</p>
                </div>
            </div>

            <span class="w-fit rounded-full bg-emerald-50 px-4 py-1.5 text-xs font-semibold text-emerald-700">
                {{ categoriesList().length }} collections
            </span>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            @for (category of categoriesList(); track category._id) {
            <article
                class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-1.5 hover:border-emerald-200 hover:shadow-xl motion-reduce:transform-none motion-reduce:transition-none">

                <!-- Image -->
                <div class="relative aspect-[4/3] overflow-hidden bg-slate-100">
                    <img [src]="category.image" [alt]="category.name" loading="lazy" decoding="async"
                        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110 motion-reduce:transform-none" />

                    <div aria-hidden="true"
                        class="absolute inset-0 bg-linear-to-t from-slate-900/50 via-transparent to-transparent opacity-70 transition-opacity duration-300 group-hover:opacity-90">
                    </div>

                    <span
                        class="absolute left-4 top-4 rounded-full bg-white/95 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider text-slate-700 shadow-sm">
                        Collection
                    </span>

                    <!-- Name over image -->
                    <h2 class="absolute inset-x-4 bottom-4 truncate text-xl font-bold text-white drop-shadow"
                        [title]="category.name">
                        {{ category.name }}
                    </h2>
                </div>

                <!-- Footer -->
                <div class="flex items-center justify-between gap-3 px-5 py-4">
                    <p class="truncate text-sm text-slate-500">
                        <i class="fas fa-tag mr-1.5 text-xs text-emerald-500"></i>{{ category.slug }}
                    </p>

                    <a aria-hidden="true" [routerLink]="['/shop' ,category._id]"
                        class="cursor-pointer flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition-all duration-300 group-hover:translate-x-1 group-hover:bg-emerald-600 group-hover:text-white">
                        <i class="fas fa-arrow-right text-xs"></i>
                    </a>
                </div>
            </article>
            }
        </div>
    </div>
</section>
